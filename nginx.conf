server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/octet-stream;

  location / {
    try_files $uri $uri/ =404;
  }

  # Archivos con hash en el nombre: se guardan en caché un año
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # El avatar no tiene hash: el navegador pregunta siempre si cambió
  location /models/ {
    add_header Cache-Control "no-cache";
  }
}
