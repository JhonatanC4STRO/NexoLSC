server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/octet-stream application/wasm;

  # Aislamiento entre orígenes: la voz local (Whisper) puede usar varios núcleos
  # (unas 4 veces más rápida). «always» para que también vaya en los 404.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "credentialless" always;

  location / {
    try_files $uri $uri/ =404;
  }

  # Archivos con hash en el nombre: se guardan en caché un año
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
  }

  # El avatar no tiene hash: el navegador pregunta siempre si cambió
  location /models/ {
    add_header Cache-Control "no-cache";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
  }
}
