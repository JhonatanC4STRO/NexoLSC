<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-texto-avatar-title 01-texto-avatar-desc" id="d-01-texto-avatar-root"><title id="01-texto-avatar-title">Del texto al avatar, paso a paso</title><desc id="01-texto-avatar-desc">El texto escrito se limpia, se convierte en una lista de señas, el reproductor avanza su reloj en cada cuadro y el avatar mezcla las animaciones de la pose del momento.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-01-texto-avatar-root { --color-paper: #f5f9f6; --color-ink: #0f2a2e; --color-muted: #4a6266; --color-accent: #0b6b4f; }
      #d-01-texto-avatar-root { font-family: 'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif; color: var(--color-ink); }
      #d-01-texto-avatar-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-01-texto-avatar-root .diagram-container { overflow-x: visible; }</style><marker id="d-01-texto-avatar-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a6266"/></marker><marker id="d-01-texto-avatar-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b6b4f"/></marker><marker id="d-01-texto-avatar-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a4f00"/></marker></defs><rect width="100%" height="100%" fill="#f5f9f6"/><path d="M288 108 L368 108" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-01-texto-avatar-arrow)"/><path d="M592 108 L672 108" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-01-texto-avatar-arrow)"/><path d="M784 136 L784 248" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-01-texto-avatar-arrow)"/><path d="M672 276 L592 276" fill="none" stroke="#0b6b4f" stroke-width="1.2" marker-end="url(#d-01-texto-avatar-arrow-accent)"/><path d="M368 276 L288 276" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-01-texto-avatar-arrow)"/><rect x="306" y="88" width="44" height="12" rx="2" fill="#f5f9f6"/><text x="328" y="97" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">LIMPIAR</text><rect x="598" y="88" width="68" height="12" rx="2" fill="#f5f9f6"/><text x="632" y="97" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">BUSCAR SEÑAS</text><rect x="792" y="186" width="40" height="12" rx="2" fill="#f5f9f6"/><text x="812" y="195" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">CARGAR</text><rect x="600" y="256" width="64" height="12"