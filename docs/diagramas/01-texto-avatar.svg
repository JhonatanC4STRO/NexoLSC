.8"/><text x="390.0" y="263" fill="#4a6266" font-size="7" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.08em">POSE</text><text x="480.0" y="280" fill="#0f2a2e" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="middle">Pose del momento</text><text x="480.0" y="294" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">de qué letra a cuál</text><rect x="64" y="248" width="224" height="56" rx="6" fill="#f5f9f6"/><rect x="64" y="248" width="224" height="56" rx="6" fill="#0f2a2e" fill-opacity="0.05" stroke="#4a6266" stroke-width="1"/><rect x="72" y="254" width="20" height="12" rx="2" fill="none" stroke="#4a6266" stroke-opacity="0.45" stroke-width="0.8"/><text x="82.0" y="263" fill="#4a6266" font-size="7" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.08em">3D</text><text x="176.0" y="280" fill="#0f2a2e" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="middle">El avatar se mueve</text><text x="176.0" y="294" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">60 veces por segundo</text><line x1="32" y1="344" x2="928" y2="344" stroke="#0f2a2e" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="360" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" letter-spacing="0.14em">LEYENDA</text><rect x="108" y="350" width="20" height="12" rx="3" fill="#4a6266" fill-opacity="0.10" stroke="#71898a" stroke-width="1"/><text x="136" y="360" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace">Entrada</text><rect x="191.2" y="350" width="20" height="12" rx="3" fill="#ffffff" stroke="#0f2a2e" stroke-width="1"/><text x="219.2" y="360" fill="#4a6266"