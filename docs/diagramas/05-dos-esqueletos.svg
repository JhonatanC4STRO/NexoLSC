 letra ya guardada</text><text x="736.0" y="172" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">lo mueve three.js</text><line x1="32" y1="272" x2="928" y2="272" stroke="#0f2a2e" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="288" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" letter-spacing="0.14em">LEYENDA</text><rect x="108" y="278" width="20" height="12" rx="3" fill="#ffffff" stroke="#0f2a2e" stroke-width="1"/><text x="136" y="288" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace">Paso</text><rect x="174.4" y="278" width="20" height="12" rx="3" fill="#0b6b4f" fill-opacity="0.08" stroke="#0b6b4f" stroke-width="1"/><text x="202.4" y="288" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace">Foco</text><line x1="240.8" y1="284" x2="264.8" y2="284" stroke="#0b6b4f" stroke-width="1.2" marker-end="url(#d-05-dos-esqueletos-arrow-accent)"/><text x="272.8" y="288" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace">Camino principal</text></svg>
