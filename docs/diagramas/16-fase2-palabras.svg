      #d-16-fase2-palabras-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-16-fase2-palabras-root .diagram-container { overflow-x: visible; }</style><marker id="d-16-fase2-palabras-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a6266"/></marker><marker id="d-16-fase2-palabras-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b6b4f"/></marker><marker id="d-16-fase2-palabras-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a4f00"/></marker></defs><rect width="100%" height="100%" fill="#f5f9f6"/><path d="M440 88 L440 128" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-16-fase2-palabras-arrow)"/><path d="M440 184 L440 224" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-16-fase2-palabras-arrow)"/><path d="M440 280 L440 308" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-16-fase2-palabras-arrow)"/><path d="M552 356 L640 356" fill="none" stroke="#0b6b4f" stroke-width="1.2" marker-end="url(#d-16-fase2-palabras-arrow-accent)"/><path d="M440 404 L440 448" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-16-fase2-palabras-arrow)"/><path d="M440 504 L440 568" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-16-fase2-palabras-arrow)"/><path d="M752 384 L752 588 A8 8 0 0 1 744 596 L560 596" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-16-fase2-palabras-arrow)"/><rect x="448" y="102" width="44" height="12" rx="2" fill="#f5f9f6"/><text x="470" y="111" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">LIMPIAR</text><rect x="448" y="198" width="60" height="12" rx="2" fill="#f5f9f6"/><text x="478" y="207" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">FORMA BASE</text><rect x="586" y="336" width="20" height="12" rx="2" fill="#f5f9f6"/><text x="596" y="345" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">SÍ</text><rect x="448" y="420" width="20" height="12" rx="2" fill="#f5f9f6"/><text x="458" y="429" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="300" y="32" width="280" height="56" rx="28" fill="#f5f9f6"/><rect x="300" y="32" width="280" height="56" rx="28" fill="#4a6266" fill-opacity="0.10" stroke="#71898a" stroke-width="1"/><text x="440.0" y="64" fill="#0f2a2e" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="middle">Escribes «Mi casa es grande»</text><rect x="328" y="128" width="224" height="56" rx="6" fill="#f5f9f6"/><rect x="328" y="128" width="224" height="56" rx="6" fill="#ffffff" stroke="#0f2a2e" stroke-width="1"/><text x="440.0" y="154" fill="#0f2a2e" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="middle">Palabras limpias</text><text x="440.0" y="168" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">MI · CASA · ES · GRANDE</text><rect x="328" y="224" width="224" height="56" rx="6" fill="#f5f9f6"/><rect x="328" y="224" width="224" height="56" rx="6" fill="#ffffff" stroke="#0f2a2e" stroke-width="1"/><text x="440.0" y="250" fill="#0f2a2e" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="middle">Forma base de cada palabra</text><text x="440.0" y="264" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">casas → CASA</text><polygon points="440.0,308 552,356.0 440.0,404 328,356.0" fill="#f5f9f6"/><polygon poi