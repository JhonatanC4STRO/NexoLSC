<svg viewBox="0 0 960 696" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="16-fase2-palabras-title 16-fase2-palabras-desc" id="d-16-fase2-palabras-root"><title id="16-fase2-palabras-title">Fase 2: palabras completas</title><desc id="16-fase2-palabras-desc">El texto se limpia por palabras y cada palabra se lleva a su forma base; si existe su seña se usa, y si no, se deletrea letra por letra; las dos salidas llegan al reproductor.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-16-fase2-palabras-root { --color-paper: #f5f9f6; --color-ink: #0f2a2e; --color-muted: #4a6266; --color-accent: #0b6b4f; }
