      #d-01-taller-contenido-root { font-family: 'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif; color: var(--color-ink); }
      #d-01-taller-contenido-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-01-taller-contenido-root .diagram-container { overflow-x: visible; }</style><marker id="d-01-taller-contenido-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a6266"/></marker><marker id="d-01-taller-contenido-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b6b4f"/></marker><marker id="d-01-taller-contenido-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a4f00"/></marker></defs><rect width="100%" height="100%" fill="#f5f9f6"/><path d="M816 104 L816 168" fill="none" stroke="#4a6266" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-01-taller-contenido-arrow)"/><path d="M232 196 L272 196" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-01-taller-contenido-arrow)"/><path d="M472 196 L512 196" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-01-taller-contenido-arrow)"/><path d="M712 196 L752 196" fill="none" stroke="#0b6b4f" stroke-width="1.2" marker-end="url(#d-01-taller-contenido-arrow-accent)"/><path d="M856 224 L856 296" fill="none" stroke="#0b6b4f" stroke-width="1.2" marker-end="url(#d-01-taller-contenido-arrow-accent)"/><path d="M752 324 L712 324" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-01-taller-contenido-arrow)"/><path d="M512 324 L472 324" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-01-taller-contenido-arrow)"/><rect x="824" y="130" width="68" height="12" rx="2" fill="#f5f9f6"/><text x="858" y="139" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">AVATAR NUEVO</text><rect x="864" y="254" width="48" height="12" rx="2" fill="#f5f9f6"/><text x="888" y="263" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" lett