<svg viewBox="0 0 960 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-taller-contenido-title 01-taller-contenido-desc" id="d-01-taller-contenido-root"><title id="01-taller-contenido-title">Cómo se crean los avatares y sus letras</title><desc id="01-taller-contenido-desc">La ficha del personaje crea el avatar en Blender; sus letras se perfeccionan a mano (o se copian de otro avatar) y luego se exporta el archivo .glb que la app registra.</desc><defs>
