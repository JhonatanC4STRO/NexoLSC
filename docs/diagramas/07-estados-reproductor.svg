<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07-estados-reproductor-title 07-estados-reproductor-desc" id="d-07-estados-reproductor-root"><title id="07-estados-reproductor-title">Los estados del reproductor</title><desc id="07-estados-reproductor-desc">El reproductor pasa de En espera a Reproduciendo; desde ahí puede pausar y continuar o terminar, y saltar a una letra lleva a En pausa; detener vuelve siempre a En espera.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-07-estados-reproductor-root { --color-paper: #f5f9f6; --color-ink: #0f2a2e; --color-muted: #4a6266; --color-accent: #0b6b4f; }
      #d-07-estados-reproductor-root { font-family: 'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif; color: var(--color-ink); }
      #d-07-estados-reproductor-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-07-estados-reproductor-root .diagram-container { overflow-x: visible; }</style><marker id="d-07-estados-reproductor-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a6266"/></marker><marker id="d-07-estados-reproductor-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b6b4f"/></marker><marker id="d-07-estados-reproductor-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a4f00"/></marker></defs><rect width="100%" height="100%" fill="#f5f9f6"/><path d="M62 200 L112 200" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-07-estados-reproductor-arrow)"/><path d="M176 172 L176 108 A8 8 0 0 1 184 100 L400 100" fill="none" stroke="#0b6b4f" stroke-width="1.2" marker-end="url(#d-07-estados-reproductor-arrow-accent)"/><path d="M464 128 L464 272" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-07-estados-reproductor-arrow)"/><path d="M528 272 L528 128" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-07-estados-reproductor-arrow)"/><path d="M592 92 L836 92 A8 8 0 0 1 844 100 L844 172" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-07-estados-reproductor-arrow)"/><path d="M788 172 L788 116 A8 8 0 0 0 780 108 L592 108" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-07-estados-reproductor-arrow)"/><path d="M176 228 L176 292 A8 8 0 0 0 184 300 L400 300" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-07-estados-reproductor-arrow)"/><path d="M816 228 L816 292 A8 8 0 0 1 808 300 L592 300" fill="none" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-07-estados-reproductor-arrow)"/><rect x="67" y="180" width="40" height="12" rx="2" fill="#f5f9f6"/><text x="87" y="189" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">CARGAR</text><rect x="258" y="80" width="60" height="12" rx="2" fill="#f5f9f6"/><text x="288" y="89" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">REPRODUCIR</text><rect x="416" y="194" width="40" height="12" rx="2" fill="#f5f9f6"/><text x="436" y="203" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">PAUSAR</text><rect x="536" y="194" width="56" height="12" rx="2" fill="#f5f9f6"/><text x="564" y="203" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">CONTINUAR</text><rect x="684" y="72" width="68" height="12" rx="2" fill="#f5f9f6"/><text x="718" y="81" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">ÚLTIMA LETRA</text><rect x="660" y="116" width="60" height="12" rx="2" fill="#f5f9f6"/><text x="690" y="125" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">REPRODUCIR</text><rect x="268" y="280" width="40" height="12" rx="2" fill="#f5f9f6"/><text x="288" y="289" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">SALTAR</text><rect x="684" y="280" width="40" height="12" rx="2" fill="#f5f9f6"/><text x="704" y="289" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.06em">SALTAR</text><circle cx="56" cy="200" r="6" fill="#0f2a2e"/><rect x="112" y="172" width="160" height="56" rx="8" fill="#f5f9f6"/><rect x="112" y="172" width="160" height="56" rx="8" fill="#ffffff" stroke="#0f2a2e" stroke-width="1"/><text x="192.0" y="198" fill="#0f2a2e" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="middle">En espera</text><text x="192.0" y="212" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">idle</text><rect x="400" y="72" width="192" height="56" rx="8" fill="#f5f9f6"/><rect x="400" y="72" width="192" height="56" rx="8" fill="#0b6b4f" fill-opacity="0.08" stroke="#0b6b4f" stroke-width="1"/><text x="496.0" y="98" fill="#0f2a2e" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="middle">Reproduciendo</text><text x="496.0" y="112" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">playing</text><rect x="400" y="272" width="192" height="56" rx="8" fill="#f5f9f6"/><rect x="400" y="272" width="192" height="56" rx="8" fill="#ffffff" stroke="#0f2a2e" stroke-width="1"/><text x="496.0" y="298" fill="#0f2a2e" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="middle">En pausa</text><text x="496.0" y="312" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">paused</text><rect x="736" y="172" width="160" height="56" rx="8" fill="#f5f9f6"/><rect x="736" y="172" width="160" height="56" rx="8" fill="#ffffff" stroke="#0f2a2e" stroke-width="1"/><text x="816.0" y="198" fill="#0f2a2e" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="middle">Terminado</text><text x="816.0" y="212" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">ended</text><text x="480" y="372" fill="#4a6266" font-size="14" font-style="italic" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="middle">Detener, desde cualquier estado, vuelve a «En espera».</text><line x1="32" y1="400" x2="928" y2="400" stroke="#0f2a2e" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="416" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" letter-spacing="0.14em">LEYENDA</text><rect x="108" y="406" width="20" height="12" rx="3" fill="#ffffff" stroke="#0f2a2e" stroke-width="1"/><text x="136" y="416" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace">Paso</text><rect x="174.4" y="406" width="20" height="12" rx="3" fill="#0b6b4f" fill-opacity="0.08" stroke="#0b6b4f" stroke-width="1"/><text x="202.4" y="416" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace">Foco</text><line x1="240.8" y1="412" x2="264.8" y2="412" stroke="#4a6266" stroke-width="1.2" marker-end="url(#d-07-estados-reproductor-arrow)"/><text x="272.8" y="416" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace">Flujo</text><line x1="316.8" y1="412" x2="340.8" y2="412" stroke="#0b6b4f" stroke-width="1.2" marker-end="url(#d-07-estados-reproductor-arrow-accent)"/><text x="348.8" y="416" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace">Camino principal</text></svg>
