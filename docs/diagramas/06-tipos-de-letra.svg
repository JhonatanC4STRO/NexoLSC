<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 264" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06-tipos-de-letra-title 06-tipos-de-letra-desc" id="d-06-tipos-de-letra-root"><title id="06-tipos-de-letra-title">Dos tipos de letra</title><desc id="06-tipos-de-letra-desc">Una letra quieta tarda 250 ms en llegar y se mantiene 600 ms; una letra con movimiento tarda 250 ms en llegar y hace su recorrido en 950 ms.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-06-tipos-de-letra-root { --color-paper: #f5f9f6; --color-ink: #0f2a2e; --color-muted: #4a6266; --color-accent: #0b6b4f; }
      #d-06-tipos-de-letra-root { font-family: 'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif; color: var(--color-ink); }
      #d-06-tipos-de-letra-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-06-tipos-de-letra-root .diagram-container { overflow-x: visible; }</style><marker id="d-06-tipos-de-letra-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a6266"/></marker><marker id="d-06-tipos-de-letra-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b6b4f"/></marker><marker id="d-06-tipos-de-letra-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a4f00"/></marker></defs><rect width="100%" height="100%" fill="#f5f9f6"/><text x="40" y="70" fill="#0f2a2e" font-size="11" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif">Letra quieta</text><text x="40" y="84" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace">21 letras</text><text x="686" y="76" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace">850 ms</text><rect x="232" y="56" width="130" height="32" rx="4" fill="#f5f9f6"/><rect x="232" y="56" width="130" height="32" rx="4" fill="#0f2a2e" fill-opacity="0.05" stroke="#4a6266" stroke-width="1"/><text x="297" y="76" fill="#0f2a2e" font-size="11" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="middle">Llegar · 250 ms</text><rect x="362" y="56" width="312" height="32" rx="4" fill="#f5f9f6"/><rect x="362" y="56" width="312" height="32" rx="4" fill="#ffffff" stroke="#0f2a2e" stroke-width="1"/><text x="518" y="76" fill="#0f2a2e" font-size="11" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="middle">Mantener la pose · 600 ms</text><text x="40" y="134" fill="#0f2a2e" font-size="11" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif">Letra con movimiento</text><text x="40" y="148" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace">G H J Ñ S Z</text><text x="868" y="140" fill="#4a6266" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace">1.200 ms</text><rect x="232" y="120" width="130" height="32" rx="4" fill="#f5f9f6"/><rect x="232" y="120" width="130" height="32" rx="4" fill="#0f2a2e" fill-opacity="0.05" stroke="#4a6266" stroke-width="1"/><text x="297" y="140" fill="#0f2a2e" font-size="11" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="middle">Llegar · 250 ms</text><rect x="362" y="120" width="494" height="32" rx="4" fill="#f5f9f6"/><rect x="362" y="120" width="494" height="32" rx="4" fill="#0b6b4f" fill-opacity="0.08" stroke="#0b6b4f" stroke-width="1"/><text x="609" y="140" fill="#0f2a2e" font-size="11" font-weight="700" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="middle">Hacer el recorrido · 950 ms</text><line x1="232" y1="184" x2="856" y2="184" stroke="#d3e2da" stroke-width="1"/><line x1="232" y1="184" x2="232" y2="188" stroke="#71898a" stroke-width="1"/><text x="232" y="200" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">0 ms</text><line x1="388" y1="184" x2="388" y2="188" stroke="#71898a" stroke-width="1"/><text x="388" y="200" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">300 ms</text><line x1="544" y1="184" x2="544" y2="188" stroke="#71898a" stroke-width="1"/><text x="544" y="200" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">600 ms</text><line x1="700" y1="184" x2="700" y2="188" stroke="#71898a" stroke-width="1"/><text x="700" y="200" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">900 ms</text><line x1="856" y1="184" x2="856" y2="188" stroke="#71898a" stroke-width="1"/><text x="856" y="200" fill="#4a6266" font-size="8" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">1200 ms</text><text x="40" y="236" fill="#4a6266" font-size="14" font-style="italic" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" text-anchor="start">A velocidad normal (1x). Los tiempos se ajustarán con personas sordas.</text></svg>
